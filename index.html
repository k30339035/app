<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영어-한글 단어 매칭 게임 Pro</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- 난이도 선택 화면 -->
    <div class="difficulty-screen" id="difficultyScreen">
        <div class="difficulty-container">
            <h1 class="game-title">영어-한글 매칭 게임</h1>
            <p class="game-subtitle">난이도를 선택하세요</p>

            <div class="difficulty-cards">
                <div class="difficulty-card" data-difficulty="easy">
                    <div class="difficulty-icon">🌱</div>
                    <h3>쉬움</h3>
                    <p>12장 카드</p>
                    <p class="pairs">6개 쌍</p>
                </div>
                <div class="difficulty-card" data-difficulty="medium">
                    <div class="difficulty-icon">⚡</div>
                    <h3>보통</h3>
                    <p>18장 카드</p>
                    <p class="pairs">9개 쌍</p>
                </div>
                <div class="difficulty-card" data-difficulty="hard">
                    <div class="difficulty-icon">🔥</div>
                    <h3>어려움</h3>
                    <p>24장 카드</p>
                    <p class="pairs">12개 쌍</p>
                </div>
            </div>

            <!-- 최고 기록 -->
            <div class="best-scores" id="bestScores">
                <h3>🏆 최고 기록</h3>
                <div class="score-list">
                    <div class="score-item">
                        <span>쉬움:</span>
                        <span id="bestEasy">-</span>
                    </div>
                    <div class="score-item">
                        <span>보통:</span>
                        <span id="bestMedium">-</span>
                    </div>
                    <div class="score-item">
                        <span>어려움:</span>
                        <span id="bestHard">-</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 게임 화면 -->
    <div class="game-screen" id="gameScreen" style="display: none;">
        <div class="container">
            <div class="header">
                <h1>영어-한글 매칭 게임</h1>
                <button id="backBtn" class="back-btn">← 난이도 선택</button>
            </div>

            <!-- 통계 패널 -->
            <div class="stats-panel">
                <div class="stat-card">
                    <div class="stat-icon">⏱️</div>
                    <div class="stat-content">
                        <div class="stat-label">시간</div>
                        <div class="stat-value" id="timer">00:00</div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon">🎯</div>
                    <div class="stat-content">
                        <div class="stat-label">시도</div>
                        <div class="stat-value" id="moves">0</div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon">⭐</div>
                    <div class="stat-content">
                        <div class="stat-label">점수</div>
                        <div class="stat-value" id="score">0</div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon">📊</div>
                    <div class="stat-content">
                        <div class="stat-label">정확도</div>
                        <div class="stat-value" id="accuracy">100%</div>
                    </div>
                </div>
            </div>

            <!-- 진행 바 -->
            <div class="progress-container">
                <div class="progress-info">
                    <span>진행 상황</span>
                    <span id="progress">0/12</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressBar"></div>
                </div>
            </div>

            <!-- 게임 보드 -->
            <div class="game-board" id="gameBoard">
                <!-- 카드들이 여기에 동적으로 생성됩니다 -->
            </div>

            <div class="game-controls">
                <button id="pauseBtn" class="control-btn">⏸️ 일시정지</button>
                <button id="resetBtn" class="control-btn reset">🔄 새 게임</button>
            </div>
        </div>
    </div>

    <!-- 게임 완료 모달 -->
    <div class="modal" id="completionModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>🎉 축하합니다!</h2>
                <p>모든 단어를 매칭했습니다!</p>
            </div>

            <div class="modal-stats">
                <div class="modal-stat">
                    <div class="modal-stat-label">완료 시간</div>
                    <div class="modal-stat-value" id="modalTime">00:00</div>
                </div>
                <div class="modal-stat">
                    <div class="modal-stat-label">총 시도</div>
                    <div class="modal-stat-value" id="modalMoves">0</div>
                </div>
                <div class="modal-stat">
                    <div class="modal-stat-label">정확도</div>
                    <div class="modal-stat-value" id="modalAccuracy">100%</div>
                </div>
                <div class="modal-stat highlight">
                    <div class="modal-stat-label">최종 점수</div>
                    <div class="modal-stat-value score" id="modalScore">0</div>
                </div>
            </div>

            <div class="modal-achievement" id="modalAchievement"></div>

            <div class="modal-actions">
                <button id="playAgainBtn" class="modal-btn primary">🔄 다시 플레이</button>
                <button id="changeDifficultyBtn" class="modal-btn">🎯 난이도 변경</button>
            </div>
        </div>
    </div>

    <!-- 일시정지 모달 -->
    <div class="modal" id="pauseModal">
        <div class="modal-content">
            <h2>⏸️ 일시정지</h2>
            <p>게임이 일시정지되었습니다</p>
            <div class="modal-actions">
                <button id="resumeBtn" class="modal-btn primary">▶️ 계속하기</button>
                <button id="quitBtn" class="modal-btn">🏠 나가기</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
