<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영어-한글 단어 매칭 게임</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>영어-한글 단어 매칭 게임</h1>

        <div class="game-info">
            <div class="progress">
                진행 상황: <span id="progress">0/12</span>
            </div>
            <button id="resetBtn" class="reset-btn">새 게임</button>
        </div>

        <div class="game-board" id="gameBoard">
            <!-- 카드들이 여기에 동적으로 생성됩니다 -->
        </div>

        <div class="message" id="message"></div>
    </div>

    <script src="game.js"></script>
</body>
</html>
